{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block head_title %}{% trans "Login" %}{% endblock %}</title>
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css" />
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --brand:#2563eb; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', Arial, sans-serif; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid #1f2937; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
    .errorlist { list-style: none; padding: 0; margin: 0 0 8px; color: #fca5a5; font-size: 13px; }
  </style>
</head>
<body>
  {% block body %}
  <div class="wrap">
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
  {% endblock %}
</body>
</html>
