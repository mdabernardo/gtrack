
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GTrack Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <style>
        body {
            background: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .topbar {
            background: #32a000;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            height: 54px;
        }
        .topbar .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            margin: 0 7px;
            font-size: 22px;
        }
        .topbar .icon-btn img {
            width: 28px;
            height: 28px;
            vertical-align: middle;
        }
        .topbar .spacer {
            flex: 1;
        }
        .main {
            background: #5dbb29;
            min-height: 92vh;
            padding: 36px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard-cards {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }
        .dashboard-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            padding: 18px 24px;
            width: 210px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dashboard-card img, .dashboard-card .graph {
            width: 140px;
            height: 100px;
            margin-bottom: 12px;
        }
        .dashboard-card .graph {
            background: #222;
            border-radius: 6px;
            position: relative;
            margin-top: 6px;
        }
        .dashboard-card .status-list {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 13px;
        }
        .dashboard-card .status {
            display: flex; align-items: center; margin-bottom: 6px;
        }
        .dashboard-card .status-dot {
            width: 10px; height: 10px; border-radius: 50%; margin-right: 7px;
        }
        .dashboard-card .status-dot.s1 { background: #32a000;}
        .dashboard-card .status-dot.s2 { background: #ffe500;}
        .dashboard-card .status-dot.s3 { background: #ff3838;}
        .dashboard-card-title {
            color: #222;
            font-weight: bold;
            text-align: center;
            margin: 10px 0 0 0;
        }
        .dashboard-card-btn {
            margin-top: 8px;
            padding: 7px 18px;
            background: #32a000;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .dashboard-card-btn:hover {
            background: #256b00;
        }
        .schedules-card {
            background: #6d9f5d;
            color: #fff;
            border-radius: 10px;
            width: 210px;
            min-height: 100px;
            padding: 13px 17px;
            margin-bottom: 10px;
        }
        .schedules-card h4 {
            margin-top: 0;
            margin-bottom: 9px;
            font-size: 1.07em;
            font-weight: 600;
            color: #fffbe5;
        }
        .schedules-list {
            list-style: none;
            margin: 0; padding: 0;
        }
        .schedules-list li {
            padding: 5px 0 5px 8px;
            font-size: 1em;
            border-bottom: 1px solid #7ccb7c44;
        }
        .schedules-list li:last-child { border-bottom: none; }
        @media (max-width: 900px) {
            .dashboard-cards { flex-direction: column; align-items: center; gap: 30px;}
            .dashboard-card, .schedules-card { width: 90vw; max-width: 340px;}
        }
    </style>
</head>
<body>
    {% include 'partials/topbar.html' with active_tab='dashboard' %}
    <div class="main">
        <div class="dashboard-cards">
            <!-- Track Trucks Card -->
            {% load static %}

<div class="dashboard-card">
    <img src="{% static 'img/gps.jpg' %}" alt="Track Trucks" width="48" height="48">
    <div class="dashboard-card-title">Track Trucks</div>
    <button class="dashboard-card-btn" onclick="location.href='{% url 'track_trucks' %}'">Open</button>
</div>
            <!-- Garbage Level Card -->
            <div class="dashboard-card">
                <div class="graph">
                    <!-- Example: Use an img or SVG for a real graph in production -->
                    <svg width="140" height="100">
                        <!-- Background -->
                        <rect x="0" y="0" width="140" height="100" fill="#fff"/>
                        <!-- Example graph line -->
                        <polyline points="10,90 40,50 80,70 120,40" stroke="#32a000" stroke-width="4" fill="none"/>
                        <circle cx="10" cy="90" r="4" fill="#32a000"/>
                        <circle cx="40" cy="50" r="4" fill="#ffe500"/>
                        <circle cx="80" cy="70" r="4" fill="#ff3838"/>
                        <circle cx="120" cy="40" r="4" fill="#32a000"/>
                    </svg>
                    <div class="status-list" style="right:-65px;top:10px;">
                        <div class="status"><span class="status-dot s1"></span> Sitio 6</div>
                        <div class="status"><span class="status-dot s2"></span> Valdez</div>
                        <div class="status"><span class="status-dot s3"></span> Hernandez</div>
                    </div>
                </div>
                <div class="dashboard-card-title">Garbage Level</div>
                <button class="dashboard-card-btn" onclick="location.href='{% url 'garbage_level' %}'">Open</button>
            </div>
            
        </div>
    </div>
</body>
</html>
