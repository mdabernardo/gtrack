{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Level Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #map {
            height: 320px;
        }
        /* Custom marker CSS is no longer needed for Google Maps */
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    </head>
<body class="min-h-screen flex flex-col bg-white">
    {% include 'partials/topbar.html' with active_tab='garbage_level' %}
    <div class="px-8 pt-8">
        <div class="w-full max-w-5xl mx-auto bg-[#d1ffd0] rounded-xl shadow-md p-6">
            <h2 class="text-2xl font-bold text-[#32a000] mb-4">Highest Waste Level (Analysis)</h2>
            <div id="highest-analysis" class="text-gray-800">
                <div class="text-gray-600 font-semibold">Loading…</div>
            </div>
        </div>
    </div>
    <div class="flex-grow flex justify-center items-start p-8">
        <div class="flex flex-col md:flex-row gap-8 w-full max-w-5xl">
            <div class="flex-1 bg-[#d1ffd0] rounded-xl shadow-md p-6">
                <h2 class="text-2xl font-bold text-[#32a000] mb-4">Waste Level</h2>
                <div id="map" class="w-full h-80 bg-gray-100 rounded-lg"></div>
            </div>
            <div class="flex-1 bg-[#d1ffd0] rounded-xl shadow-md p-6">
                <h2 class="text-2xl font-bold text-[#32a000] mb-4">Legend</h2>
                <ul id="legend-list" class="space-y-4">
                </ul>
            </div>
        </div>
    </div>
    <script>
        // Your Firebase configuration (apiKey is used for both Firebase and Google Maps/Geocoding)
        const firebaseConfig = {
            // NOTE: This key is used for Firebase and the geocoding/Maps API calls.
            // Ensure both Maps JavaScript API and Geocoding API are enabled for this key in your Google Cloud Console.
            apiKey: "AIzaSyAmLanEMQoY6NSEcacziav2xYyr4y8UOHU",
            authDomain: "g-trackapp.firebaseapp.com",
            databaseURL: "https://g-trackapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "g-trackapp",
            storageBucket: "g-trackapp.firebasestorage.app",
            messagingSenderId: "172056621672",
            appId: "1:172056621672:web:9481cda9b93cac6d7d01dd",
            measurementId: "G-5HRRQCP4P1"
        };
        
        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let garbageData = [];
        const routePoints = {{ route_points_json|default:"[]"|safe }};
        
        const GOOGLE_MAPS_API_KEY = firebaseConfig.apiKey;
        
        let map; // Google Maps object
        let geocoder; // Google Geocoder service
        let markers = []; // Array to hold Google Maps markers

        // Default location: Catmon, Malabon, Philippines
        const defaultCenter = { lat: 14.662, lng: 120.949 }; 

        // Function to initialize the Google Map
        function initMap() {
            // Check if the map element exists and Google Maps API has loaded
            if (!document.getElementById('map') || typeof google === 'undefined' || !google.maps) {
                console.error("Google Maps API did not load correctly or map element is missing.");
                return;
            }

            map = new google.maps.Map(document.getElementById('map'), {
                center: defaultCenter,
                zoom: 15,
                // It's highly recommended to replace "DEMO_MAP_ID" with your actual Map ID for custom styling.
                mapId: "DEMO_MAP_ID" 
            });
            geocoder = new google.maps.Geocoder();
            
            db.collection("garbagelevel").onSnapshot((snapshot) => {
                processGarbageSnapshot(snapshot);
            });
        }
        window.initMap = initMap; // Expose to global scope for the Google Maps script tag

        function normalizeWasteLevel(raw) {
            if (raw === null || raw === undefined || raw === '') return null;
            if (typeof raw === 'number') {
                if (raw < 34) return { label: 'Low', key: 'low', value: raw };
                if (raw < 67) return { label: 'Medium', key: 'medium', value: raw };
                return { label: 'High', key: 'high', value: raw };
            }
            const s = String(raw).trim().toLowerCase();
            if (!s) return null;
            if (s === '1' || s.includes('low')) return { label: 'Low', key: 'low', value: raw };
            if (s === '2' || s.includes('med')) return { label: 'Medium', key: 'medium', value: raw };
            if (s === '3' || s.includes('high') || s.includes('extreme')) return { label: 'High', key: 'high', value: raw };
            const n = Number(s);
            if (!Number.isNaN(n)) return normalizeWasteLevel(n);
            return { label: String(raw), key: 'unknown', value: raw };
        }

        function canonKey(s) {
            return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
        }

        // Helper function to get marker color and icon SVG
        function getMarkerIcon(rawLevel) {
            const lvl = normalizeWasteLevel(rawLevel);
            if (!lvl) return { color: '#808080', svg: '', label: '?', text: 'N/A' };
            let color = '#ff6384';
            let label = 'H';

            if (lvl.key === 'low') {
                color = '#4bc0c0';
                label = 'L';
            } else if (lvl.key === 'medium') {
                color = '#ffcd56';
                label = 'M';
            } else if (lvl.key === 'high') {
                color = '#ff6384';
                label = 'H';
            } else {
                color = '#808080';
                label = '?';
            }

            // A custom SVG for a circular marker
            const svg = `
                <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="15" cy="15" r="13" fill="${color}" stroke="white" stroke-width="2"/>
                    <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">${label}</text>
                </svg>`;
            
            return {
                color: color,
                // Encodes the SVG for use as a data URL in the marker icon
                svg: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                label: label,
                text: lvl.label,
            };
        }

        // Function to geocode an address string (using Google Geocoding)
        async function geocodeAddress(location) {
            return new Promise((resolve) => {
                // geocoder is initialized in initMap
                geocoder.geocode({ 'address': location }, function(results, status) {
                    if (status === 'OK' && results.length > 0) {
                        const geometry = results[0].geometry.location;
                        resolve({
                            latitude: geometry.lat(),
                            longitude: geometry.lng()
                        });
                    } else {
                        console.error(`Geocoding failed for ${location}: ${status}`);
                        resolve(null);
                    }
                });
            });
        }

        function parseLatLng(v) {
            if (v === null || v === undefined || v === '') return null;
            const n = (typeof v === 'string') ? parseFloat(v) : Number(v);
            return Number.isFinite(n) ? n : null;
        }

        function geoCacheKey(name) {
            return 'gt_geo_' + canonKey(name || '');
        }

        function tryLoadCachedCoords(item) {
            const locName = item.location || item.location_name || item.locationName || item.name || '';
            const key = geoCacheKey(locName);
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return false;
                const obj = JSON.parse(raw);
                const lat = parseLatLng(obj && obj.latitude);
                const lng = parseLatLng(obj && obj.longitude);
                if (lat === null || lng === null) return false;
                item.latitude = lat;
                item.longitude = lng;
                return true;
            } catch (e) {
                return false;
            }
        }

        let geoQueue = [];
        let geoActive = 0;
        let geoDirty = false;
        function scheduleDashboardUpdate() {
            if (geoDirty) return;
            geoDirty = true;
            setTimeout(() => {
                geoDirty = false;
                if (map) updateDashboard();
            }, 250);
        }

        function pumpGeoQueue() {
            while (geoActive < 2 && geoQueue.length) {
                const job = geoQueue.shift();
                geoActive += 1;
                job()
                    .catch(() => {})
                    .finally(() => {
                        geoActive -= 1;
                        pumpGeoQueue();
                    });
            }
        }

        function ensureCoordinates(item, docRef) {
            const lat = parseLatLng(item.latitude);
            const lng = parseLatLng(item.longitude);
            if (lat !== null && lng !== null) {
                item.latitude = lat;
                item.longitude = lng;
                return;
            }
            if (tryLoadCachedCoords(item)) {
                scheduleDashboardUpdate();
                return;
            }
            const locName = item.location || item.location_name || item.locationName || item.name || '';
            if (!locName) return;
            geoQueue.push(async () => {
                const coords = await geocodeAddress(locName + ", Malabon, Philippines");
                if (!coords) return;
                item.latitude = coords.latitude;
                item.longitude = coords.longitude;
                try {
                    localStorage.setItem(geoCacheKey(locName), JSON.stringify({ latitude: coords.latitude, longitude: coords.longitude }));
                } catch (e) {}
                try {
                    if (docRef) {
                        await docRef.set({ latitude: coords.latitude, longitude: coords.longitude }, { merge: true });
                    }
                } catch (e) {}
                scheduleDashboardUpdate();
            });
            pumpGeoQueue();
        }

        function pickLatestPerLocation(items) {
            const byLoc = new Map();
            items.forEach((it) => {
                const nameRaw = (it.location || it.location_name || it.locationName || it.name || '').toString().trim();
                if (!nameRaw) return;
                const key = canonKey(nameRaw);
                const k = pickLatestKey(it);
                const prev = byLoc.get(key);
                if (!prev) {
                    byLoc.set(key, { key, name: nameRaw, item: it, latestKey: k });
                    return;
                }
                if ((k || '') > (prev.latestKey || '')) {
                    byLoc.set(key, { key, name: nameRaw, item: it, latestKey: k });
                }
            });
            return Array.from(byLoc.values()).map((x) => x.item);
        }

        function processGarbageSnapshot(snapshot) {
            const items = [];
            snapshot.forEach((doc) => {
                const data = doc.data() || {};
                const item = { id: doc.id, ...data };
                ensureCoordinates(item, doc.ref);
                items.push(item);
            });
            garbageData = items;
            if (map) updateDashboard();
        }

        function levelScore(raw) {
            const lvl = normalizeWasteLevel(raw);
            if (!lvl) return null;
            if (lvl.key === 'low') return 1;
            if (lvl.key === 'medium') return 2;
            if (lvl.key === 'high') return 3;
            const n = Number(lvl.value);
            return Number.isNaN(n) ? null : n;
        }

        function pickLatestKey(item) {
            const d = String(item.date || '').trim();
            const t = String(item.time || '').trim();
            if (d && t) return d + 'T' + t;
            if (d) return d;
            return '';
        }

        function computeTopLocations(items) {
            const byLoc = new Map();
            items.forEach((it) => {
                const nameRaw = (it.location || it.location_name || it.locationName || it.name || '').toString().trim();
                if (!nameRaw) return;
                const name = nameRaw;
                const raw = (it.garbageLevel ?? it.garbage_level ?? it.level ?? it.severity ?? it.status);
                const score = levelScore(raw);
                if (score === null) return;
                const key = pickLatestKey(it);
                const prev = byLoc.get(name);
                if (!prev) {
                    byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                    return;
                }
                if (key && prev.key) {
                    if (key > prev.key) byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                    return;
                }
                if (key && !prev.key) {
                    byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                    return;
                }
                if (!key && !prev.key && score > prev.score) {
                    byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                }
            });
            const rows = Array.from(byLoc.values());
            rows.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                const ak = a.key || '';
                const bk = b.key || '';
                if (bk !== ak) return bk.localeCompare(ak);
                return a.name.localeCompare(b.name);
            });
            return rows.slice(0, 5);
        }

        function rawToPercent(raw) {
            if (raw === null || raw === undefined || raw === '') return 0;
            if (typeof raw === 'number') return Math.max(0, Math.min(100, raw));
            const n = Number(raw);
            if (!Number.isNaN(n)) return Math.max(0, Math.min(100, n));
            const lvl = normalizeWasteLevel(raw);
            if (!lvl) return 0;
            if (lvl.key === 'low') return 25;
            if (lvl.key === 'medium') return 55;
            if (lvl.key === 'high') return 85;
            return 0;
        }

        function labelFromPercent(pct) {
            if (pct >= 67) return 'High';
            if (pct >= 34) return 'Medium';
            if (pct > 0) return 'Low';
            return 'N/A';
        }

        function computeRouteOverall(items) {
            const points = (Array.isArray(routePoints) ? routePoints : []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
            const keys = points.map((p) => canonKey(p.location_name));
            const allowed = new Set(keys.filter(Boolean));
            const agg = new Map();

            items.forEach((it) => {
                const nameRaw = (it.location || it.location_name || it.locationName || it.name || '').toString().trim();
                if (!nameRaw) return;
                const k = canonKey(nameRaw);
                if (!allowed.has(k)) return;
                const raw = (it.garbageLevel ?? it.garbage_level ?? it.level ?? it.severity ?? it.status);
                const pct = rawToPercent(raw);
                const prev = agg.get(k) || { sum: 0, count: 0 };
                agg.set(k, { sum: prev.sum + pct, count: prev.count + 1 });
            });

            return points.map((p) => {
                const nm = String(p.location_name || '').trim();
                const k = canonKey(nm);
                const v = agg.get(k);
                const avg = v && v.count ? (v.sum / v.count) : 0;
                const pct = Math.round(avg);
                return { name: nm, percent: pct, label: labelFromPercent(pct) };
            });
        }

        function renderHighestAnalysis() {
            const el = document.getElementById('highest-analysis');
            if (!el) return;
            const routeRows = computeRouteOverall(garbageData);
            const nonEmpty = routeRows.filter((r) => r.percent > 0);
            const best = nonEmpty.slice().sort((a, b) => b.percent - a.percent)[0] || routeRows[0] || null;

            const barItems = routeRows.map((r) => {
                const color = r.percent >= 67 ? '#ff6384' : (r.percent >= 34 ? '#ffcd56' : '#4bc0c0');
                return `
                    <div class="py-2">
                        <div class="flex items-end justify-between gap-4">
                            <div class="font-extrabold text-gray-900">${r.name}</div>
                            <div class="font-extrabold text-gray-900">${r.label}</div>
                        </div>
                        <div class="w-full bg-white/70 rounded-lg h-3 mt-2 overflow-hidden">
                            <div class="h-3 rounded-lg" style="width:${r.percent}%; background:${color};"></div>
                        </div>
                    </div>
                `;
            }).join('');

            el.innerHTML = `
                <div class="mb-4">
                    <div class="text-gray-700 font-semibold">Highest overall (among your 6 locations):</div>
                    <div class="text-xl font-extrabold text-gray-900">${best ? best.name : 'N/A'} — ${best ? best.label : 'N/A'}</div>
                </div>
                <div class="text-gray-700 font-semibold mb-2">Bar chart (overall average)</div>
                <div>${barItems}</div>
            `;
        }

        function updateDashboard() {
            const legendList = document.getElementById('legend-list');
            legendList.innerHTML = '';
            
            // Clear existing markers
            markers.forEach(marker => marker.setMap(null));
            markers = []; 
            
            const infoWindow = new google.maps.InfoWindow();

            const currentItems = pickLatestPerLocation(garbageData);
            currentItems.forEach(item => {
                const levelRaw = (item.garbageLevel ?? item.garbage_level ?? item.level ?? item.severity ?? item.status);
                const markerIcon = getMarkerIcon(levelRaw);
                const locName = item.location || item.location_name || item.locationName || item.name || 'N/A';
                
                // Create Legend Item
                const li = document.createElement('li');
                li.className = 'flex items-center cursor-pointer hover:bg-gray-100 p-2 rounded';
                li.innerHTML = `
                    <span class="w-6 h-6 rounded-full" style="background-color: ${markerIcon.color};"></span>
                    <span class="ml-3 text-gray-800 text-lg">${locName} - ${markerIcon.text}</span>
                `;
                legendList.appendChild(li);


                const lat = typeof item.latitude === 'string' ? parseFloat(item.latitude) : item.latitude;
                const lng = typeof item.longitude === 'string' ? parseFloat(item.longitude) : item.longitude;
                if (lat && lng) {
                    const position = { lat: lat, lng: lng };
                    
                    // Create the Google Maps Marker
                    const marker = new google.maps.Marker({
                        position: position,
                        map: map,
                        title: `${locName} - ${markerIcon.text}`,
                        icon: {
                            url: markerIcon.svg,
                            scaledSize: new google.maps.Size(30, 30), 
                            anchor: new google.maps.Point(15, 15), 
                        },
                    });
                    
                    // Add Info Window (Popup) listener
                    marker.addListener("click", () => {
                        infoWindow.setContent(`
                            <div style="font-family: Arial;">
                                <b>${locName}</b><br>
                                Waste Level: <span style="font-weight: bold; color: ${markerIcon.color};">${markerIcon.text}</span>
                            </div>
                        `);
                        infoWindow.open(map, marker);
                    });
                    
                    markers.push(marker);

                    // Add click event to the legend item to center the map and open the info window
                    li.addEventListener('click', () => {
                        map.panTo(position);
                        map.setZoom(17);
                        // Re-open info window to draw attention to the location
                        google.maps.event.trigger(marker, 'click');
                    });
                } else {
                    console.warn(`Item with ID ${item.id} is missing coordinates or location.`);
                }
            });

            // Re-center map to the bounds of all markers
            if (markers.length > 0) {
                const bounds = new google.maps.LatLngBounds();
                markers.forEach(marker => bounds.extend(marker.getPosition()));
                map.fitBounds(bounds);
            } else {
                map.setCenter(defaultCenter);
                map.setZoom(15);
            }
            try {
                const prev = garbageData;
                garbageData = currentItems;
                renderHighestAnalysis();
                garbageData = prev;
            } catch (e) {
                renderHighestAnalysis();
            }
        }


        // --- Notification Dropdown Logic (Unchanged) ---
        function toggleDropdown() {
            document.getElementById("notificationDropdown").classList.toggle("hidden");
        }
        window.onclick = function(event) {
            if (!event.target.closest('button[title="Notifications"]') && !event.target.closest('#notificationDropdown')) {
                var dropdown = document.getElementById("notificationDropdown");
                if (!dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }
    </script>
    
    <script async defer loading="async"
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAmLanEMQoY6NSEcacziav2xYyr4y8UOHU&callback=initMap&libraries=geometry">
    </script>
</body>
</html>
