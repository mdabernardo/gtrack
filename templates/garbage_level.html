{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Level Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #map {
            height: 320px;
        }
        /* Custom marker CSS is no longer needed for Google Maps */
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    </head>
<body class="min-h-screen flex flex-col bg-white">
    {% include 'partials/topbar.html' with active_tab='garbage_level' %}
    <div class="px-8 pt-8">
        <div class="w-full max-w-5xl mx-auto bg-[#d1ffd0] rounded-xl shadow-md p-6">
            <h2 class="text-2xl font-bold text-[#32a000] mb-4">Highest Waste Level (Analysis)</h2>
            <div id="highest-analysis" class="text-gray-800">
                <div class="text-gray-600 font-semibold">Loading…</div>
            </div>
        </div>
    </div>
    <div class="px-8 py-8">
        <div class="w-full max-w-5xl mx-auto bg-[#d1ffd0] rounded-xl shadow-md p-6">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <h2 class="text-2xl font-bold text-[#32a000]">Garbage Level Records</h2>
                <div class="flex items-center gap-3">
                    <div class="text-sm font-semibold text-gray-700">Location</div>
                    <select id="records-location-filter" class="bg-white/80 border border-white/60 rounded-lg px-3 py-2 text-sm font-semibold text-gray-800">
                        <option value="__all__">All (6)</option>
                    </select>
                    <div class="text-sm font-semibold text-gray-700">Show</div>
                    <select id="records-limit" class="bg-white/80 border border-white/60 rounded-lg px-3 py-2 text-sm font-semibold text-gray-800">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                    </select>
                </div>
            </div>
            <div id="records-summary" class="mt-3 text-sm font-semibold text-gray-700"></div>
            <div class="mt-4 overflow-auto max-h-[520px] rounded-lg bg-white/70 border border-white/60">
                <table class="min-w-full text-sm text-gray-900">
                    <thead class="sticky top-0 bg-white/90">
                        <tr>
                            <th class="text-left px-4 py-3 font-extrabold">Date</th>
                            <th class="text-left px-4 py-3 font-extrabold">Time</th>
                            <th class="text-left px-4 py-3 font-extrabold">Location</th>
                            <th class="text-left px-4 py-3 font-extrabold">Level</th>
                            <th class="text-left px-4 py-3 font-extrabold">Label</th>
                        </tr>
                    </thead>
                    <tbody id="records-body" class="divide-y divide-white/60"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        // Your Firebase configuration (apiKey is used for both Firebase and Google Maps/Geocoding)
        const firebaseConfig = {
            // NOTE: This key is used for Firebase and the geocoding/Maps API calls.
            // Ensure both Maps JavaScript API and Geocoding API are enabled for this key in your Google Cloud Console.
            apiKey: "AIzaSyAmLanEMQoY6NSEcacziav2xYyr4y8UOHU",
            authDomain: "g-trackapp.firebaseapp.com",
            databaseURL: "https://g-trackapp-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "g-trackapp",
            storageBucket: "g-trackapp.firebasestorage.app",
            messagingSenderId: "172056621672",
            appId: "1:172056621672:web:9481cda9b93cac6d7d01dd",
            measurementId: "G-5HRRQCP4P1"
        };
        
        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let garbageData = [];
        const routePoints = {{ route_points_json|default:"[]"|safe }};
        
        function normalizeWasteLevel(raw) {
            if (raw === null || raw === undefined || raw === '') return null;
            if (typeof raw === 'number') {
                if (raw < 34) return { label: 'Low', key: 'low', value: raw };
                if (raw < 67) return { label: 'Medium', key: 'medium', value: raw };
                return { label: 'High', key: 'high', value: raw };
            }
            const s = String(raw).trim().toLowerCase();
            if (!s) return null;
            if (s === '1' || s.includes('low')) return { label: 'Low', key: 'low', value: raw };
            if (s === '2' || s.includes('med')) return { label: 'Medium', key: 'medium', value: raw };
            if (s === '3' || s.includes('high') || s.includes('extreme')) return { label: 'High', key: 'high', value: raw };
            const n = Number(s);
            if (!Number.isNaN(n)) return normalizeWasteLevel(n);
            return { label: String(raw), key: 'unknown', value: raw };
        }

        function canonKey(s) {
            return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
        }

        // Helper function to get marker color and icon SVG
        function getMarkerIcon(rawLevel) {
            const lvl = normalizeWasteLevel(rawLevel);
            if (!lvl) return { color: '#808080', svg: '', label: '?', text: 'N/A' };
            let color = '#ff6384';
            let label = 'H';

            if (lvl.key === 'low') {
                color = '#4bc0c0';
                label = 'L';
            } else if (lvl.key === 'medium') {
                color = '#ffcd56';
                label = 'M';
            } else if (lvl.key === 'high') {
                color = '#ff6384';
                label = 'H';
            } else {
                color = '#808080';
                label = '?';
            }

            // A custom SVG for a square marker (same style as drop-off management)
            const svg = `
                <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="20" height="20" rx="5" fill="${color}" stroke="white" stroke-width="2"/>
                    <text x="15" y="21" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">${label}</text>
                </svg>`;
            
            return {
                color: color,
                // Encodes the SVG for use as a data URL in the marker icon
                svg: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                label: label,
                text: lvl.label,
            };
        }

        function processGarbageSnapshot(snapshot) {
            const items = [];
            snapshot.forEach((doc) => {
                const data = doc.data() || {};
                items.push({ id: doc.id, ...data });
            });
            garbageData = items;
            renderHighestAnalysis();
            renderRecords();
        }

        function levelScore(raw) {
            const lvl = normalizeWasteLevel(raw);
            if (!lvl) return null;
            if (lvl.key === 'low') return 1;
            if (lvl.key === 'medium') return 2;
            if (lvl.key === 'high') return 3;
            const n = Number(lvl.value);
            return Number.isNaN(n) ? null : n;
        }

        function pickLatestKey(item) {
            const d = String(item.date || '').trim();
            const t = String(item.time || '').trim();
            if (d && t) return d + 'T' + t;
            if (d) return d;
            return '';
        }

        function computeTopLocations(items) {
            const byLoc = new Map();
            items.forEach((it) => {
                const nameRaw = (it.location || it.location_name || it.locationName || it.name || '').toString().trim();
                if (!nameRaw) return;
                const name = nameRaw;
                const raw = (it.garbageLevel ?? it.garbage_level ?? it.level ?? it.severity ?? it.status);
                const score = levelScore(raw);
                if (score === null) return;
                const key = pickLatestKey(it);
                const prev = byLoc.get(name);
                if (!prev) {
                    byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                    return;
                }
                if (key && prev.key) {
                    if (key > prev.key) byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                    return;
                }
                if (key && !prev.key) {
                    byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                    return;
                }
                if (!key && !prev.key && score > prev.score) {
                    byLoc.set(name, { name, raw, score, date: it.date, time: it.time, key });
                }
            });
            const rows = Array.from(byLoc.values());
            rows.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                const ak = a.key || '';
                const bk = b.key || '';
                if (bk !== ak) return bk.localeCompare(ak);
                return a.name.localeCompare(b.name);
            });
            return rows.slice(0, 5);
        }

        function rawToPercent(raw) {
            if (raw === null || raw === undefined || raw === '') return 0;
            if (typeof raw === 'number') return Math.max(0, Math.min(100, raw));
            const n = Number(raw);
            if (!Number.isNaN(n)) return Math.max(0, Math.min(100, n));
            const lvl = normalizeWasteLevel(raw);
            if (!lvl) return 0;
            if (lvl.key === 'low') return 25;
            if (lvl.key === 'medium') return 55;
            if (lvl.key === 'high') return 85;
            return 0;
        }

        function labelFromPercent(pct) {
            if (pct >= 67) return 'High';
            if (pct >= 34) return 'Medium';
            if (pct > 0) return 'Low';
            return 'N/A';
        }

        function computeRouteOverall(items) {
            const points = (Array.isArray(routePoints) ? routePoints : []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
            const keys = points.map((p) => canonKey(p.location_name));
            const allowed = new Set(keys.filter(Boolean));
            const agg = new Map();

            items.forEach((it) => {
                const nameRaw = (it.location || it.location_name || it.locationName || it.name || '').toString().trim();
                if (!nameRaw) return;
                const k = canonKey(nameRaw);
                if (!allowed.has(k)) return;
                const raw = (it.garbageLevel ?? it.garbage_level ?? it.level ?? it.severity ?? it.status);
                const pct = rawToPercent(raw);
                const prev = agg.get(k) || { sum: 0, count: 0 };
                agg.set(k, { sum: prev.sum + pct, count: prev.count + 1 });
            });

            return points.map((p) => {
                const nm = String(p.location_name || '').trim();
                const k = canonKey(nm);
                const v = agg.get(k);
                const avg = v && v.count ? (v.sum / v.count) : 0;
                const pct = Math.round(avg);
                return { name: nm, percent: pct, label: labelFromPercent(pct) };
            });
        }

        function renderHighestAnalysis() {
            const el = document.getElementById('highest-analysis');
            if (!el) return;
            const routeRows = computeRouteOverall(garbageData);
            const sortedRouteRows = routeRows.slice().sort((a, b) => (b.percent - a.percent) || String(a.name || '').localeCompare(String(b.name || '')));
            const nonEmpty = routeRows.filter((r) => r.percent > 0);
            const best = nonEmpty.slice().sort((a, b) => (b.percent - a.percent) || String(a.name || '').localeCompare(String(b.name || '')))[0] || sortedRouteRows[0] || null;

            const barItems = sortedRouteRows.map((r) => {
                const color = r.percent >= 67 ? '#ff3838' : (r.percent >= 34 ? '#ffe500' : '#32a000');
                return `
                    <div class="py-2">
                        <div class="flex items-end justify-between gap-4">
                            <div class="font-extrabold text-gray-900">${r.name}</div>
                            <div class="font-extrabold text-gray-900">${r.label}</div>
                        </div>
                        <div class="w-full bg-white/70 rounded-lg h-3 mt-2 overflow-hidden">
                            <div class="h-3 rounded-lg" style="width:${r.percent}%; background:${color};"></div>
                        </div>
                    </div>
                `;
            }).join('');

            el.innerHTML = `
                <div class="mb-4">
                    <div class="text-gray-700 font-semibold">Highest overall (among your 6 locations):</div>
                    <div class="text-xl font-extrabold text-gray-900">${best ? best.name : 'N/A'} — ${best ? best.label : 'N/A'}</div>
                </div>
                <div class="text-gray-700 font-semibold mb-2">Bar chart (overall average)</div>
                <div>${barItems}</div>
            `;
        }

        function safeStr(v) { return (v === null || v === undefined) ? '' : String(v); }
        function desiredLocations() {
            return [
                { key: 'lucas compound', name: 'Lucas Compound' },
                { key: 'sm hoa', name: 'SM Hoa' },
                { key: 'justice', name: 'Justice' },
                { key: 'sitio 6 basketball court', name: 'Sitio 6 basketball court' },
                { key: 'dumpsite', name: 'Dumpsite' },
                { key: 'gulayan', name: 'Gulayan' },
            ];
        }
        function dtKey(it) {
            const d = safeStr(it && it.date).trim();
            const t = safeStr(it && it.time).trim();
            if (d && t) return d + 'T' + t;
            if (d) return d;
            return '';
        }
        function normalizeLevelText(raw) {
            const lvl = normalizeWasteLevel(raw);
            return lvl ? lvl.label : 'N/A';
        }
        function normalizeLevelLabel(raw) {
            const lvl = normalizeWasteLevel(raw);
            if (!lvl) return { text: 'N/A', color: '#808080' };
            if (lvl.key === 'low') return { text: 'Low', color: '#4bc0c0' };
            if (lvl.key === 'medium') return { text: 'Medium', color: '#ffcd56' };
            if (lvl.key === 'high') return { text: 'High', color: '#ff6384' };
            return { text: lvl.label, color: '#808080' };
        }
        const RECORDS_START_DATE = '2025-12-21';
        const RECORDS_END_DATE = '2026-05-01';
        function inRecordRange(dateStr) {
            const d = safeStr(dateStr).trim().slice(0, 10);
            if (!d) return false;
            return d >= RECORDS_START_DATE && d <= RECORDS_END_DATE;
        }
        function renderRecords() {
            const body = document.getElementById('records-body');
            const summary = document.getElementById('records-summary');
            const sel = document.getElementById('records-location-filter');
            const limSel = document.getElementById('records-limit');
            if (!body || !summary || !sel || !limSel) return;

            const desired = desiredLocations();
            const desiredSet = new Set(desired.map((x) => x.key));

            if (!sel.dataset.ready) {
                desired.forEach((loc) => {
                    const opt = document.createElement('option');
                    opt.value = loc.key;
                    opt.textContent = loc.name;
                    sel.appendChild(opt);
                });
                sel.dataset.ready = '1';
                sel.addEventListener('change', renderRecords);
                limSel.addEventListener('change', renderRecords);
            }

            const filterKey = sel.value || '__all__';
            const limit = Math.max(1, Math.min(500, Number(limSel.value) || 100));

            const rows = (garbageData || [])
                .map((it) => {
                    const locName = safeStr(it.location || it.location_name || it.locationName || it.name).trim();
                    const key = canonKey(locName);
                    if (!key || !desiredSet.has(key)) return null;
                    const raw = (it.garbageLevel ?? it.garbage_level ?? it.level ?? it.severity ?? it.status);
                    return {
                        key,
                        location: locName,
                        date: safeStr(it.date).trim(),
                        time: safeStr(it.time).trim(),
                        raw,
                        dt: dtKey(it),
                    };
                })
                .filter(Boolean)
                .filter((r) => inRecordRange(r.date))
                .filter((r) => filterKey === '__all__' ? true : r.key === filterKey)
                .sort((a, b) => (b.dt || '').localeCompare(a.dt || '') || a.location.localeCompare(b.location))
                .slice(0, limit);

            let minD = null;
            let maxD = null;
            const counts = { low: 0, medium: 0, high: 0, other: 0 };
            rows.forEach((r) => {
                const d = r.date || '';
                if (d) {
                    if (!minD || d < minD) minD = d;
                    if (!maxD || d > maxD) maxD = d;
                }
                const lvl = normalizeWasteLevel(r.raw);
                if (!lvl) counts.other += 1;
                else if (lvl.key === 'low') counts.low += 1;
                else if (lvl.key === 'medium') counts.medium += 1;
                else if (lvl.key === 'high') counts.high += 1;
                else counts.other += 1;
            });

            summary.textContent = `Showing ${rows.length} record(s). Range: ${RECORDS_START_DATE} to ${RECORDS_END_DATE}. Counts: Low ${counts.low}, Medium ${counts.medium}, High ${counts.high}.`;

            body.innerHTML = rows.map((r) => {
                const lvl = normalizeLevelLabel(r.raw);
                const rawPct = rawToPercent(r.raw);
                return `
                    <tr class="hover:bg-white/60">
                        <td class="px-4 py-3 font-semibold text-gray-900">${r.date || '—'}</td>
                        <td class="px-4 py-3 font-semibold text-gray-900">${r.time || '—'}</td>
                        <td class="px-4 py-3 font-semibold text-gray-900">${r.location}</td>
                        <td class="px-4 py-3 font-extrabold text-gray-900">${Number.isFinite(rawPct) ? rawPct : 0}%</td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center gap-2 font-extrabold">
                                <span class="w-3 h-3 rounded-md" style="background:${lvl.color};"></span>
                                <span>${lvl.text}</span>
                            </span>
                        </td>
                    </tr>
                `;
            }).join('') || `
                <tr>
                    <td class="px-4 py-6 text-gray-700 font-semibold" colspan="5">No records found for the 6 locations.</td>
                </tr>
            `;
        }

        function initDashboard() {
            db.collection("garbagelevel").onSnapshot((snapshot) => {
                processGarbageSnapshot(snapshot);
            }, () => {});
        }

        initDashboard();


        // --- Notification Dropdown Logic (Unchanged) ---
        function toggleDropdown() {
            document.getElementById("notificationDropdown").classList.toggle("hidden");
        }
        window.onclick = function(event) {
            if (!event.target.closest('button[title="Notifications"]') && !event.target.closest('#notificationDropdown')) {
                var dropdown = document.getElementById("notificationDropdown");
                if (!dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }
    </script>
</body>
</html>
